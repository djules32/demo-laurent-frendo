<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laurent Frendo — Plombier à Gouvieux | Expertise & Confiance</title>
  <meta name="description" content="Laurent Frendo, plombier professionnel à Gouvieux (60270). Installation, réparation, dépannage. Marques Atlantic, Grohe, Geberit. Intervention rapide et fiable.">
  <style>
    /* ═══════════════════════════════════════════════
       IMPORTS & VARIABLES
    ═══════════════════════════════════════════════ */
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap');

    :root {
      --primary: #003D7A;
      --primary-dark: #002550;
      --primary-light: #004d99;
      --accent: #FF6B35;
      --accent-light: #ff8558;
      --white: #ffffff;
      --off-white: #F7F5F0;
      --dark: #0F1923;
      --gray: #6B7280;
      --gray-light: #E5E7EB;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-md: 0 8px 32px rgba(0,0,0,0.12);
      --shadow-lg: 0 20px 60px rgba(0,0,0,0.18);
      --radius: 4px;
      --radius-lg: 12px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      color: var(--dark);
      background: var(--off-white);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* ═══════════════════════════════════════════════
       NOISE TEXTURE SVG (appliquée en overlay)
    ═══════════════════════════════════════════════ */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.6;
    }

    /* ═══════════════════════════════════════════════
       ANIMATIONS
    ═══════════════════════════════════════════════ */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes slideRight {
      from { opacity: 0; transform: translateX(-30px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes lineDraw {
      from { width: 0; }
      to   { width: 60px; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.9); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    .hero-title {
      animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
    }
    .hero-sub {
      animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.45s both;
    }
    .hero-divider {
      animation: fadeIn 0.6s ease 0.65s both;
    }
    .hero-ctas {
      animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.7s both;
    }
    .hero-badge {
      animation: fadeIn 1s ease 1s both;
    }

    /* ═══════════════════════════════════════════════
       HAMBURGER MENU CSS-ONLY
    ═══════════════════════════════════════════════ */
    #nav-toggle { display: none; }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 8px;
      z-index: 200;
    }
    .hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--white);
      transition: all 0.3s ease;
      transform-origin: center;
    }

    #nav-toggle:checked ~ .nav-overlay { opacity: 1; pointer-events: all; }
    #nav-toggle:checked ~ header .mobile-menu { transform: translateX(0); }
    #nav-toggle:checked ~ header .hamburger span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }
    #nav-toggle:checked ~ header .hamburger span:nth-child(2) { opacity: 0; }
    #nav-toggle:checked ~ header .hamburger span:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -5px);
    }

    /* ═══════════════════════════════════════════════
       HEADER
    ═══════════════════════════════════════════════ */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 1.2rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.4s ease, padding 0.4s ease, box-shadow 0.4s ease;
      background: transparent;
    }

    /* Sticky opaque sur scroll — CSS only via animation fill */
    @keyframes header-scroll {
      from { background: transparent; box-shadow: none; }
      to { background: var(--primary-dark); box-shadow: 0 4px 24px rgba(0,0,0,0.25); }
    }

    header {
      animation: header-scroll linear both;
      animation-timeline: scroll(root);
      animation-range: 0px 80px;
    }

    .logo {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }
    .logo-name {
      font-family: var(--font-display);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--white);
      letter-spacing: -0.01em;
    }
    .logo-tagline {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 500;
      margin-top: 2px;
    }

    nav.desktop-nav {
      display: flex;
      align-items: center;
      gap: 2.5rem;
    }
    nav.desktop-nav a {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      position: relative;
      transition: color 0.3s;
    }
    nav.desktop-nav a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--accent);
      transition: width 0.3s ease;
    }
    nav.desktop-nav a:hover { color: var(--white); }
    nav.desktop-nav a:hover::after { width: 100%; }

    .nav-cta {
      background: var(--accent);
      color: var(--white) !important;
      padding: 0.55rem 1.4rem;
      border-radius: 2px;
      font-weight: 600 !important;
      transition: background 0.3s, transform 0.2s !important;
    }
    .nav-cta::after { display: none !important; }
    .nav-cta:hover {
      background: var(--accent-light) !important;
      transform: translateY(-1px);
    }

    /* Mobile menu */
    .mobile-menu {
      display: none;
      position: fixed;
      top: 0;
      right: 0;
      width: 280px;
      height: 100vh;
      background: var(--primary-dark);
      z-index: 150;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .mobile-menu a {
      color: var(--white);
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* ═══════════════════════════════════════════════
       HERO
    ═══════════════════════════════════════════════ */
    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        linear-gradient(160deg,
          #001e3d 0%,
          #003D7A 45%,
          #002550 100%
        );
    }

    /* Mesh gradient orbs */
    .hero::before {
      content: '';
      position: absolute;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(255,107,53,0.22) 0%, transparent 65%);
      top: -150px;
      right: -100px;
      border-radius: 50%;
      pointer-events: none;
    }

    .hero::after {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0,164,239,0.15) 0%, transparent 65%);
      bottom: -100px;
      left: -50px;
      border-radius: 50%;
      pointer-events: none;
    }

    /* Geometric grid pattern */
    .hero-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 820px;
      padding: 2rem 1.5rem;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      padding: 0.4rem 1.2rem;
      border-radius: 100px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.8rem;
      animation: fadeIn 0.8s ease 0.1s both;
    }
    .hero-eyebrow::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 900;
      color: var(--white);
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin-bottom: 1.5rem;
    }
    .hero-title .accent-word {
      color: var(--accent);
      font-style: italic;
    }

    .hero-divider {
      width: 60px;
      height: 2px;
      background: var(--accent);
      margin: 0 auto 1.8rem;
    }

    .hero-sub {
      font-size: clamp(1.05rem, 2.2vw, 1.3rem);
      color: rgba(255,255,255,0.78);
      max-width: 560px;
      margin: 0 auto 3rem;
      font-weight: 300;
      line-height: 1.75;
    }

    .hero-ctas {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 4rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 1rem 2.4rem;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      text-decoration: none;
      border-radius: 2px;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--white);
      box-shadow: 0 4px 20px rgba(255,107,53,0.4);
    }
    .btn-primary::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .btn-primary:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 32px rgba(255,107,53,0.55);
    }
    .btn-primary:hover::before { opacity: 1; }

    .btn-ghost {
      background: transparent;
      color: var(--white);
      border: 1.5px solid rgba(255,255,255,0.4);
    }
    .btn-ghost:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.8);
      transform: translateY(-2px);
    }

    .hero-badge {
      display: flex;
      justify-content: center;
      gap: 3rem;
      flex-wrap: wrap;
    }
    .badge-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
    }
    .badge-number {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
      color: var(--white);
      line-height: 1;
    }
    .badge-label {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      font-weight: 500;
    }
    .badge-sep {
      width: 1px;
      height: 40px;
      background: rgba(255,255,255,0.2);
      align-self: center;
    }

    /* Scroll indicator */
    .scroll-hint {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      color: rgba(255,255,255,0.4);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      animation: fadeIn 1s ease 1.5s both;
    }
    .scroll-hint::after {
      content: '';
      display: block;
      width: 1px;
      height: 40px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.4), transparent);
      animation: float 2s ease-in-out infinite;
    }

    /* ═══════════════════════════════════════════════
       WAVE SEPARATOR
    ═══════════════════════════════════════════════ */
    .wave-sep {
      line-height: 0;
      overflow: hidden;
    }
    .wave-sep svg { display: block; width: 100%; }

    /* ═══════════════════════════════════════════════
       SECTION COMMONS
    ═══════════════════════════════════════════════ */
    section { padding: 6rem 1.5rem; }
    .container { max-width: 1080px; margin: 0 auto; }
    .container-sm { max-width: 760px; margin: 0 auto; }

    .section-label {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
    }
    .section-label::before {
      content: '';
      display: block;
      width: 24px;
      height: 2px;
      background: var(--accent);
    }

    .section-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.2rem);
      color: var(--primary);
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 1.25rem;
    }
    .section-desc {
      font-size: 1.05rem;
      color: var(--gray);
      line-height: 1.8;
      max-width: 560px;
    }

    /* ═══════════════════════════════════════════════
       SERVICES
    ═══════════════════════════════════════════════ */
    .services {
      background: var(--white);
      position: relative;
    }

    .services-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 2rem;
      margin-bottom: 3.5rem;
      flex-wrap: wrap;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }

    .service-card {
      background: var(--off-white);
      border-radius: var(--radius-lg);
      padding: 2.5rem 2rem;
      position: relative;
      overflow: hidden;
      cursor: default;
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      border: 1px solid transparent;
    }

    .service-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      opacity: 0;
      transition: opacity 0.4s ease;
      border-radius: var(--radius-lg);
    }

    .service-card::after {
      content: '';
      position: absolute;
      bottom: -60px;
      right: -60px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(255,107,53,0.3) 0%, transparent 70%);
      transition: all 0.5s ease;
      pointer-events: none;
    }

    .service-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-lg);
      border-color: var(--primary);
    }
    .service-card:hover::before { opacity: 1; }
    .service-card:hover::after {
      bottom: -20px;
      right: -20px;
    }

    .service-card > * { position: relative; z-index: 1; }

    .service-icon-wrap {
      width: 56px;
      height: 56px;
      background: rgba(0,61,122,0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin-bottom: 1.5rem;
      transition: background 0.4s ease;
    }
    .service-card:hover .service-icon-wrap {
      background: rgba(255,107,53,0.25);
    }

    .service-card h3 {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.75rem;
      transition: color 0.3s;
    }
    .service-card:hover h3 { color: var(--white); }

    .service-card p {
      font-size: 0.9rem;
      color: var(--gray);
      line-height: 1.7;
      transition: color 0.3s;
    }
    .service-card:hover p { color: rgba(255,255,255,0.75); }

    .service-card .card-arrow {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 1.5rem;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      transition: gap 0.3s, color 0.3s;
    }
    .service-card:hover .card-arrow {
      gap: 0.7rem;
      color: var(--accent-light);
    }

    /* Diagonal separator */
    .diag-sep {
      height: 80px;
      background: var(--white);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 30%);
    }
    .diag-sep-reverse {
      height: 80px;
      clip-path: polygon(0 30%, 100% 0, 100% 100%, 0 100%);
    }

    /* ═══════════════════════════════════════════════
       ABOUT
    ═══════════════════════════════════════════════ */
    .about {
      background: var(--off-white);
      padding: 7rem 1.5rem;
      position: relative;
    }

    .about-inner {
      display: grid;
      grid-template-columns: 5fr 4fr;
      gap: 5rem;
      align-items: center;
    }

    .about-visual {
      position: relative;
      flex-shrink: 0;
    }

    .about-img-block {
      background: linear-gradient(135deg, var(--primary) 0%, #001e3d 100%);
      border-radius: 16px;
      height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .about-img-block::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .about-img-block .big-icon {
      font-size: 6rem;
      position: relative;
      z-index: 1;
      animation: float 4s ease-in-out infinite;
    }

    .about-stat-card {
      position: absolute;
      background: var(--white);
      border-radius: 12px;
      padding: 1rem 1.4rem;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .about-stat-card.card-1 {
      bottom: -20px;
      right: -24px;
    }
    .about-stat-card.card-2 {
      top: -20px;
      left: -24px;
    }
    .stat-icon { font-size: 1.6rem; }
    .stat-text strong {
      display: block;
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--primary);
      line-height: 1;
    }
    .stat-text span {
      font-size: 0.75rem;
      color: var(--gray);
      font-weight: 500;
    }

    .about-text .section-desc {
      margin-bottom: 2rem;
    }

    .brands-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 2rem;
    }
    .brand-tag {
      background: var(--white);
      border: 1.5px solid var(--gray-light);
      color: var(--primary);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.45rem 1rem;
      border-radius: 100px;
      transition: all 0.3s;
    }
    .brand-tag:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--white);
    }

    .about-features {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      margin-top: 2.5rem;
    }
    .about-feature {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }
    .feature-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 0.45rem;
    }
    .about-feature p {
      font-size: 0.92rem;
      color: var(--gray);
      line-height: 1.6;
    }
    .about-feature strong { color: var(--primary); }

    /* ═══════════════════════════════════════════════
       TESTIMONIALS
    ═══════════════════════════════════════════════ */
    .testimonials {
      background: var(--primary);
      padding: 6rem 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .testimonials::before {
      content: '"';
      position: absolute;
      top: -2rem;
      left: 2rem;
      font-family: var(--font-display);
      font-size: 20rem;
      color: rgba(255,255,255,0.04);
      line-height: 1;
      pointer-events: none;
    }

    .testimonials .section-title { color: var(--white); }
    .testimonials .section-label { color: var(--accent); }

    .testi-header {
      text-align: center;
      margin-bottom: 4rem;
    }
    .testi-header .section-label { justify-content: center; }

    .testi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }

    .testi-card {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-lg);
      padding: 2.2rem;
      transition: all 0.3s ease;
      position: relative;
    }
    .testi-card:hover {
      background: rgba(255,255,255,0.12);
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.2);
    }

    .testi-stars {
      display: flex;
      gap: 3px;
      margin-bottom: 1.2rem;
      color: var(--accent);
      font-size: 0.9rem;
    }
